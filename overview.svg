<svg xmlns="http://www.w3.org/2000/svg" width="340" height="144" viewBox="0 0 340 144" role="img" aria-label="GitHub statistics">
<style>
text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; }
.r { opacity: 0; animation: show .4s ease-out forwards; }
@keyframes show { to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .r { animation: none; opacity: 1; } }
</style>
<rect x="0.5" y="0.5" width="339" height="143" rx="8" fill="none" stroke="#7d859055"/>
<text x="14" y="22" font-weight="700" fill="#14a098">GitHub statistics</text>
<text class="r" style="animation-delay:0.00s" x="14" y="44" fill="#7d8590">Stars</text><text class="r" style="animation-delay:0.00s" x="326" y="44" text-anchor="end" font-weight="700" fill="#14a098">6</text><text class="r" style="animation-delay:0.12s" x="14" y="70" fill="#7d8590">Public repositories</text><text class="r" style="animation-delay:0.12s" x="326" y="70" text-anchor="end" font-weight="700" fill="#14a098">10</text><text class="r" style="animation-delay:0.24s" x="14" y="96" fill="#7d8590">Contributions, last year</text><text class="r" style="animation-delay:0.24s" x="326" y="96" text-anchor="end" font-weight="700" fill="#14a098">433</text><text class="r" style="animation-delay:0.36s" x="14" y="122" fill="#7d8590">Commits, last year</text><text class="r" style="animation-delay:0.36s" x="326" y="122" text-anchor="end" font-weight="700" fill="#14a098">422</text>
